<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AethelDesk</title>
  <link rel="stylesheet" href="/styles/room.css" />
</head>
<body class="w-screen h-screen overflow-hidden flex items-center justify-center select-none">

  <!-- Stars (night only) -->
  <canvas id="stars" class="absolute inset-0 w-full h-full opacity-0"></canvas>

  <!-- Clouds (day only) -->
  <canvas id="clouds" class="absolute inset-0 w-full h-full" style="pointer-events:none;opacity:0;transition:opacity 2s ease;"></canvas>

  <!-- Scene layers (city / beach / forest) sit above sky gradient, below sun/moon SVG -->
  <canvas id="city-canvas"   class="absolute inset-0 w-full h-full" style="pointer-events:none;opacity:0;transition:opacity 1.5s ease;"></canvas>
  <canvas id="beach-canvas"  class="absolute inset-0 w-full h-full" style="pointer-events:none;opacity:0;transition:opacity 1.5s ease;"></canvas>
  <canvas id="forest-canvas" class="absolute inset-0 w-full h-full" style="pointer-events:none;opacity:0;transition:opacity 1.5s ease;"></canvas>

  <!-- Sun / Moon arc -->
  <svg id="sky" class="absolute inset-0 w-full h-full" xmlns="http://www.w3.org/2000/svg" style="pointer-events:none;">
    <defs>
      <radialGradient id="moonGrad" cx="38%" cy="38%" r="58%">
        <stop offset="0%"   stop-color="#FBFCFF"/>
        <stop offset="45%"  stop-color="#E5E9F5"/>
        <stop offset="78%"  stop-color="#C2CADC"/>
        <stop offset="100%" stop-color="#8B95B0"/>
      </radialGradient>
      <radialGradient id="moonShade" cx="78%" cy="78%" r="62%">
        <stop offset="0%"   stop-color="rgba(20,18,42,0.35)"/>
        <stop offset="80%"  stop-color="rgba(20,18,42,0)"/>
      </radialGradient>
      <radialGradient id="moonHalo" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="rgba(220,230,255,0.32)"/>
        <stop offset="40%"  stop-color="rgba(220,230,255,0.08)"/>
        <stop offset="100%" stop-color="rgba(220,230,255,0)"/>
      </radialGradient>
      <radialGradient id="sunCore" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#FFFFFF"/>
        <stop offset="40%"  stop-color="#FFF6D0"/>
        <stop offset="100%" stop-color="#FFD964"/>
      </radialGradient>
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="rgba(255,225,120,0.85)"/>
        <stop offset="55%"  stop-color="rgba(255,180,60,0.35)"/>
        <stop offset="100%" stop-color="rgba(255,160,40,0)"/>
      </radialGradient>
      <radialGradient id="sunCorona" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="rgba(255,210,90,0.20)"/>
        <stop offset="60%"  stop-color="rgba(255,180,60,0.08)"/>
        <stop offset="100%" stop-color="rgba(255,140,30,0)"/>
      </radialGradient>
      <radialGradient id="crater1" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="rgba(120,128,150,0.55)"/>
        <stop offset="100%" stop-color="rgba(120,128,150,0)"/>
      </radialGradient>
      <radialGradient id="satGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="rgba(255,255,255,1)"/>
        <stop offset="40%"  stop-color="rgba(255,255,255,0.6)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      </radialGradient>
    </defs>

    <path id="arc-path" fill="none" stroke="white" stroke-width="0.5" opacity="0.15" />

    <!-- ── SUN ─────────────────────────────────────────────── -->
    <g id="sun-group" style="transform:translate(-200px,-200px);opacity:0;">
      <g class="sun-corona">
        <circle cx="0" cy="0" r="180" fill="url(#sunCorona)" opacity="0.55"/>
        <circle cx="0" cy="0" r="110" fill="url(#sunCorona)" opacity="0.75"/>
      </g>
      <g class="sun-bloom">
        <circle cx="0" cy="0" r="72" fill="url(#sunGlow)" opacity="0.85"/>
        <circle cx="0" cy="0" r="48" fill="url(#sunGlow)" opacity="0.95"/>
      </g>
      <circle cx="0" cy="0" r="28" fill="url(#sunCore)"/>
      <circle cx="0" cy="0" r="22" fill="#FFFBE8" opacity="0.95"/>
      <g opacity="0.16" stroke="rgba(255,240,180,0.9)" stroke-width="1" stroke-linecap="round">
        <line x1="-86" y1="0" x2="86" y2="0"/>
        <line x1="0" y1="-86" x2="0" y2="86"/>
      </g>
    </g>

    <!-- ── SESSION SATELLITE ───────────────────────────────── -->
    <g id="sat-group" style="transform:translate(-200px,-200px);opacity:0;">
      <circle cx="0" cy="0" r="92" fill="none"
              stroke="currentColor" stroke-width="0.9"
              stroke-dasharray="2 4" opacity="0.30"/>
      <circle cx="0" cy="0" r="92" fill="none"
              stroke="currentColor" stroke-width="0.5" opacity="0.10"/>
      <g id="sat-rot">
        <circle cx="0" cy="0" r="14" fill="url(#satGlow)" opacity="0.85"/>
        <circle cx="0" cy="0" r="5"  fill="currentColor" opacity="0.55"/>
        <circle cx="0" cy="0" r="2.6" fill="rgba(255,255,255,1)"/>
        <path d="M 0 0 m -10 -2 a 11 11 0 0 1 18 -4"
              fill="none" stroke="currentColor" stroke-width="1.4"
              stroke-linecap="round" opacity="0.35"/>
      </g>
    </g>

    <!-- ── MOON ────────────────────────────────────────────── -->
    <g id="moon-group" style="transform:translate(-200px,-200px);opacity:1;">
      <circle class="moon-halo" cx="0" cy="0" r="60" fill="url(#moonHalo)"/>
      <circle cx="0" cy="0" r="26" fill="url(#moonGrad)"/>
      <g style="clip-path: circle(26px at 0 0);">
        <circle cx="0" cy="0" r="26" fill="url(#moonShade)"/>
        <circle cx="-7" cy="-9" r="3.2" fill="url(#crater1)" opacity="0.6"/>
        <circle cx="6"  cy="4"  r="2.4" fill="url(#crater1)" opacity="0.5"/>
        <circle cx="-3" cy="10" r="1.8" fill="url(#crater1)" opacity="0.55"/>
        <circle cx="9"  cy="-6" r="1.2" fill="url(#crater1)" opacity="0.4"/>
      </g>
      <circle cx="0" cy="0" r="26" fill="none"
              stroke="rgba(255,255,255,0.35)" stroke-width="0.6"/>
      <circle cx="10" cy="-4" r="22" fill="#0B091A" opacity="0.92"/>
    </g>
  </svg>

  <!-- ─────────────────────────────────────────────────────────────
       HUD: top-left → room code + session dots
       ───────────────────────────────────────────────────────────── -->
  <div id="hud-tl" class="absolute top-7 left-8 text-white animate-fade-rise">
    <div class="hud-chip liquid-glass">
      <span class="inline-block w-1 h-1 rounded-full bg-current opacity-60"></span>
      <span id="room-label" class="ui-num text-[12px] text-white"></span>
      <span class="w-px h-3" style="background:linear-gradient(to bottom,transparent,rgba(255,255,255,0.22),transparent);"></span>
      <span id="sessions" class="text-[12px] text-white opacity-80 tracking-[0.32em] leading-none"></span>
    </div>
  </div>

  <!-- ─────────────────────────────────────────────────────────────
       HUD: top-right → conn dot + clock + date
       ───────────────────────────────────────────────────────────── -->
  <div id="hud-tr" class="absolute top-7 right-8 text-right flex flex-col items-end gap-2 animate-fade-rise-delay">
    <div class="hud-chip liquid-glass">
      <span id="conn-dot" class="inline-block w-1.5 h-1.5 rounded-full bg-white opacity-0 transition-opacity duration-1000" aria-hidden="true"></span>
      <span id="clock" class="font-display text-white text-[18px] leading-none" style="letter-spacing: 0.01em;">--:--</span>
    </div>
    <span id="conn-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true">방 연결을 준비하고 있습니다.</span>
    <div id="date-label" class="ui-label opacity-60 pr-1"></div>
  </div>

  <div id="room-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="timer-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- ─────────────────────────────────────────────────────────────
       CENTER: Focus button + duration chips (idle state)
       ───────────────────────────────────────────────────────────── -->
  <div id="center-cluster" class="relative z-10 flex flex-col items-center gap-7 animate-fade-rise-delay-2">
    <button id="focus-btn" class="focus-btn liquid-glass interactive" aria-describedby="timer-status">
      집중 시작
    </button>

    <div id="dur-chips" class="liquid-glass inline-flex items-center gap-1 px-1.5 py-1.5" role="group" aria-label="집중 시간 선택" style="border-radius: 999px;">
      <button data-min="25" class="dur-segment" aria-pressed="false">25분</button>
      <button data-min="50" class="dur-segment" aria-pressed="false">50분</button>
    </div>
  </div>

  <!-- ─────────────────────────────────────────────────────────────
       POMODORO: monumental timer + active controls (hidden until active)
       ───────────────────────────────────────────────────────────── -->
  <div id="pomodoro"
    class="absolute z-10 opacity-0 pointer-events-none flex flex-col items-center gap-12">
    <span id="pom-time">50:00</span>

    <div class="grid place-items-center">
      <div id="break-row"
        class="col-start-1 row-start-1 opacity-0 pointer-events-none flex items-center gap-3 px-4 py-1.5 rounded-full liquid-glass" aria-hidden="true" inert>
        <span class="pom-ctl" style="color:hsl(var(--foreground));">휴식</span>
        <span class="ctrl-sep"></span>
        <button id="btn-skip-break" class="pom-ctl">건너뛰기 →</button>
      </div>
      <div id="focus-row"
        class="col-start-1 row-start-1 opacity-0 pointer-events-none flex items-center gap-3 px-4 py-1.5 rounded-full liquid-glass" aria-hidden="true" inert>
        <button id="btn-pause-timer"  class="pom-ctl">일시정지</button>
        <span class="ctrl-sep"></span>
        <button id="btn-cancel-timer" class="pom-ctl">취소</button>
      </div>
    </div>
  </div>

  <!-- ─────────────────────────────────────────────────────────────
       TIME DIAL: bottom-left
       ───────────────────────────────────────────────────────────── -->
  <div id="time-dial" class="absolute bottom-7 left-7 z-30 select-none animate-fade-rise-delay-3"
       title="시간을 드래그하여 조절 (더블클릭으로 리셋)">
    <div class="liquid-glass px-4 py-3 flex flex-col gap-2" style="min-width: 12rem; border-radius: var(--radius);">
      <div class="dial-header flex items-center justify-between">
        <div class="flex items-center gap-1.5 opacity-80">
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
          <span class="ui-label">시간</span>
        </div>
        <output id="time-value" for="time-slider" class="ui-num text-[10px] opacity-70">12:00</output>
        <button id="btn-reset-time" title="현재 시각으로"
          class="ui-label opacity-55 hover:opacity-100 transition-opacity" aria-label="현재 시각으로 되돌리기">지금</button>
      </div>
      <p id="time-help" class="sr-only">슬라이더로 방의 하늘 시간을 조절합니다. 지금 버튼으로 현재 시각으로 되돌립니다.</p>
      <div class="flex items-center gap-2 opacity-95 pt-0.5">
        <span class="ui-num text-[9px] opacity-40">00</span>
        <input id="time-slider" type="range" min="0" max="1439" value="720"
               aria-label="하늘 시간 조절" aria-describedby="time-help time-value" aria-valuetext="12:00"
               class="w-32 cursor-pointer" />
        <span class="ui-num text-[9px] opacity-40">24</span>
      </div>
    </div>
  </div>

  <!-- ─────────────────────────────────────────────────────────────
       CONTROLS: bottom-center
       Stack (bottom → top): action-bar · exit-confirm · track-row · music-bar
       ───────────────────────────────────────────────────────────── -->
  <div id="controls" class="absolute bottom-7 left-0 right-0 px-6 flex flex-col gap-2 items-center z-20 animate-fade-rise-delay-3">

    <!-- Music controls: hidden until user adds a track -->
    <div id="music-bar" class="ctrl-bar liquid-glass" aria-hidden="true" inert>
      <button id="btn-pause" class="ctrl-btn" aria-label="음악 일시정지">일시정지</button>
      <button id="btn-play"  class="ctrl-btn" aria-label="음악 재생">재생</button>
      <span class="ctrl-sep"></span>
      <button id="btn-skip"  class="ctrl-btn" aria-label="다음 음악으로 넘기기">다음 →</button>
    </div>

    <!-- Track input: shown when + 트랙 tapped -->
    <div id="track-row" class="liquid-glass" style="display:none;border-radius:999px;padding:0.6rem 1.2rem;align-items:center;gap:0.75rem;" aria-hidden="true" inert>
      <label for="track-input" class="sr-only">음악 트랙 YouTube 링크 또는 영상 ID</label>
      <input id="track-input" type="text" inputmode="url" autocomplete="off" spellcheck="false"
              placeholder="YouTube URL 또는 영상 ID"
              aria-describedby="track-error"
              class="bg-transparent outline-none border-b pb-1"
              style="width:min(200px,46vw);" />
      <span id="track-error" class="ui-label min-w-0" role="status" aria-live="polite" aria-atomic="true" style="opacity:0.7;"></span>
      <button id="track-add"    class="ctrl-btn">추가</button>
      <span class="ctrl-sep"></span>
      <button id="track-cancel" class="ctrl-btn" style="opacity:0.6;">취소</button>
    </div>

    <!-- Exit confirmation: shown when timer active + 나가기 tapped -->
    <div id="exit-confirm" class="ctrl-bar liquid-glass" role="alertdialog" aria-modal="true" aria-labelledby="exit-confirm-title" style="display:none;" aria-hidden="true" inert tabindex="-1">
      <span id="exit-confirm-title" class="ctrl-btn" style="opacity:0.65;cursor:default;pointer-events:none;">정말 나가시겠어요?</span>
      <span class="ctrl-sep"></span>
      <button id="btn-exit-yes" class="ctrl-btn" style="color:rgba(255,90,70,0.95);">나가기</button>
      <span class="ctrl-sep"></span>
      <button id="btn-exit-no"  class="ctrl-btn">취소</button>
    </div>

    <!-- Action bar: always visible -->
    <div id="action-bar" class="ctrl-bar liquid-glass">
      <button id="btn-scene"     class="ctrl-btn" aria-label="장면 바꾸기: 하늘" aria-describedby="scene-options">◈ 하늘</button>
      <span class="ctrl-sep"></span>
      <button id="btn-add-track" class="ctrl-btn" aria-describedby="track-error">+ 트랙</button>
      <span class="ctrl-sep"></span>
      <button id="btn-locate"    class="ctrl-btn" aria-describedby="location-help room-status">◎ 위치</button>
      <span class="ctrl-sep"></span>
      <button id="btn-exit"      class="ctrl-btn">← 나가기</button>
    </div>

  </div>
  <p id="scene-options" class="sr-only">장면: 하늘, 도시, 해변, 숲. 현재 선택은 하늘입니다.</p>
  <p id="location-help" class="sr-only">위치 권한은 현재 장소 기준으로 하늘의 시간과 고도를 맞추는 데만 사용됩니다.</p>

  <!-- Room PIN prompt: shown only when a session token is missing or rejected. -->
  <div id="room-auth" class="absolute inset-0 z-40 hidden items-center justify-center px-6" role="dialog" aria-modal="true" aria-labelledby="room-auth-title" tabindex="-1">
    <div class="liquid-glass flex flex-col items-center gap-4 px-7 py-6 text-center" style="border-radius: var(--radius);">
      <div id="room-auth-title" class="ui-label opacity-70">방 PIN</div>
      <label for="room-pin-input" class="sr-only">방 PIN</label>
      <input id="room-pin-input" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN"
              aria-describedby="room-auth-error"
              class="bg-transparent outline-none border-b pb-2 text-center w-36" />
      <p id="room-auth-error" class="ui-label min-h-4 opacity-70" role="alert" aria-live="assertive" aria-atomic="true"></p>
      <button id="room-pin-submit" class="ctrl-btn">입장</button>
    </div>
  </div>

  <!-- Hidden YouTube player -->
  <div id="yt-frame" class="absolute" aria-hidden="true" inert style="width:1px;height:1px;overflow:hidden;left:-9999px;top:-9999px;"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070a12" />
  <title>AethelDesk</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/tailwind.css" />
  <link rel="stylesheet" href="/fonts.css" />
  <link rel="stylesheet" href="/velorah.css" />
  <style>
    @import url("/lobby.css");

    /* Kept page-local because the sky module applies the day state. */
    body.day #pin-input,
    body.day #code-toggle { color: var(--lobby-text); }
    body.day #btn-start { color: var(--lobby-gold-ink); }
  </style>
</head>
<body>
  <canvas id="stars" class="sky-layer" aria-hidden="true"></canvas>
  <canvas id="clouds" class="sky-layer" aria-hidden="true"></canvas>

  <svg class="celestial-orbit" aria-hidden="true">
    <defs>
      <radialGradient id="moonGradL" cx="42%" cy="42%" r="50%">
        <stop offset="0%" stop-color="#f3f5ff" />
        <stop offset="60%" stop-color="#d9def0" />
        <stop offset="100%" stop-color="#9daac7" />
      </radialGradient>
      <radialGradient id="moonHaloL" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#dfe8ff" stop-opacity="0.28" />
        <stop offset="100%" stop-color="#dfe8ff" stop-opacity="0" />
      </radialGradient>
      <filter id="arcBlur" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="5" />
      </filter>
    </defs>
    <path id="arc-glow" fill="none" stroke="currentColor" stroke-width="7" opacity="0.06" stroke-linecap="round" filter="url(#arcBlur)" />
    <path id="arc-path" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.16" />
    <g id="sun-group">
      <circle cx="0" cy="0" r="55" fill="#f2c66d" opacity="0.10" />
      <circle cx="0" cy="0" r="34" fill="#f2c66d" opacity="0.22" />
      <circle cx="0" cy="0" r="20" fill="#ffdc91" opacity="0.62" />
      <circle cx="0" cy="0" r="14" fill="#fff7dd" opacity="0.96" />
    </g>
    <g id="moon-group">
      <circle cx="0" cy="0" r="46" fill="url(#moonHaloL)" />
      <circle cx="0" cy="0" r="13" fill="url(#moonGradL)" />
      <circle cx="5" cy="-2" r="11" fill="#0b1020" opacity="0.90" />
    </g>
  </svg>

  <div class="sky-vignette" aria-hidden="true"></div>
  <div class="sky-grain" aria-hidden="true"></div>

  <main class="lobby-shell">
    <section class="lobby-intro animate-fade-rise" aria-labelledby="lobby-title">
      <div class="observatory-mark" aria-hidden="true">
        <span class="observatory-mark__star"></span>
        <span class="observatory-mark__orbit"></span>
      </div>

      <p class="eyebrow">SHARED CELESTIAL FOCUS</p>
      <h1 id="lobby-title" class="lobby-wordmark">AethelDesk</h1>
      <p class="lobby-tagline">같은 하늘 아래,<br /> 각자의 일에 깊이 머무는 시간.</p>

      <div class="quiet-signal" aria-label="AethelDesk 소개">
        <span class="quiet-signal__line" aria-hidden="true"></span>
        <span>실시간 하늘</span>
        <span class="quiet-signal__dot" aria-hidden="true"></span>
        <span>함께하는 포모도로</span>
      </div>
    </section>

    <section class="entry-panel animate-fade-rise-delay" aria-labelledby="entry-title">
      <header class="entry-header">
        <p class="entry-kicker">FOCUS ROOM</p>
        <h2 id="entry-title">오늘의 집중을 시작하세요</h2>
        <p>하나의 PIN으로 새 방을 만들거나, 이미 열린 방에 들어갈 수 있어요.</p>
      </header>

      <div class="pin-field">
        <label for="pin-input">방 PIN</label>
        <div class="field-shell">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7.5 10V7.5a4.5 4.5 0 0 1 9 0V10M6 10h12v10H6z" />
          </svg>
          <input id="pin-input" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN 입력"
            aria-describedby="pin-hint lobby-error" />
        </div>
        <p id="pin-hint" class="field-hint">방을 보호할 PIN을 입력해 주세요.</p>
      </div>

      <div class="entry-actions">
        <button id="btn-start" type="button" class="primary-action">
          <span class="button-copy">
            <strong>새 방 만들기</strong>
            <small>방 코드는 자동으로 만들어져요</small>
          </span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m9 5 7 7-7 7" />
          </svg>
        </button>

        <button id="code-toggle" type="button" class="secondary-action"
          aria-expanded="false" aria-controls="code-section">
          <span class="button-copy">
            <strong>방 코드로 입장</strong>
            <small>초대받은 코드가 있어요</small>
          </span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m8 10 4 4 4-4" />
          </svg>
        </button>
      </div>

      <div id="code-section" aria-hidden="true">
        <div class="join-panel">
          <label for="room-input">방 코드</label>
          <div class="join-row">
            <input id="room-input" type="text" maxlength="64" autocomplete="off" autocapitalize="characters"
              spellcheck="false" placeholder="예: ASTR4" aria-describedby="code-hint lobby-error" tabindex="-1" />
            <button id="btn-join" type="button" tabindex="-1">입장하기</button>
          </div>
          <p id="code-hint" class="field-hint">초대받은 방 코드와 위의 PIN을 사용합니다.</p>
        </div>
      </div>

      <p id="lobby-error" role="status" aria-live="polite" aria-atomic="true"></p>
    </section>
  </main>

  <footer class="lobby-footer" aria-label="서비스 특징">
    <span>브라우저에서 바로 시작</span>
    <span aria-hidden="true">·</span>
    <span>설치 없이 함께 집중</span>
  </footer>

  <script type="module" src="/lobby.js"></script>
</body>
</html>

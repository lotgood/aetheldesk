<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AethelDesk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet" />
  <style>
    :root { --focus-ring: currentColor; }
    * { font-family: 'Inter', sans-serif; }
    body { overflow: hidden; }
    ::placeholder { color: currentColor; opacity: 0.25; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 5px;
      border-radius: 999px;
    }
    #code-section {
      max-height: 0; opacity: 0; overflow: hidden; pointer-events: none;
      transition: max-height 0.4s ease, opacity 0.4s ease;
    }
    #lobby-error {
      min-height: 1rem;
      transition: opacity 0.3s ease;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body class="w-screen h-screen flex items-center justify-center select-none">

  <!-- Stars -->
  <canvas id="stars" class="absolute inset-0 w-full h-full" style="opacity:0;pointer-events:none;transition:opacity 2s ease;"></canvas>

  <!-- Clouds (day only) -->
  <canvas id="clouds" class="absolute inset-0 w-full h-full" style="pointer-events:none;opacity:0;transition:opacity 2s ease;"></canvas>

  <!-- Sun / Moon arc -->
  <svg class="absolute inset-0 w-full h-full" style="pointer-events:none;">
    <defs>
      <radialGradient id="moonGradL" cx="42%" cy="42%" r="50%">
        <stop offset="0%"   stop-color="#F0F4FF"/>
        <stop offset="60%"  stop-color="#D0D8F0"/>
        <stop offset="100%" stop-color="#A8B8D8"/>
      </radialGradient>
    </defs>
    <path id="arc-path" fill="none" stroke-width="0.5" opacity="0.15" />
    <g id="sun-group" style="transform:translate(-200px,-200px);opacity:0;transition:opacity 1.5s ease;">
      <circle cx="0" cy="0" r="55" fill="#FFB200" opacity="0.12"/>
      <circle cx="0" cy="0" r="36" fill="#FFCC00" opacity="0.25"/>
      <circle cx="0" cy="0" r="22" fill="#FFE566" opacity="0.55"/>
      <circle cx="0" cy="0" r="16" fill="#FFFBE8" opacity="0.95"/>
    </g>
    <g id="moon-group" style="transform:translate(-200px,-200px);opacity:1;transition:opacity 1.5s ease;">
      <circle cx="0" cy="0" r="13" fill="url(#moonGradL)"/>
      <circle cx="5" cy="-2" r="11" fill="#0B091A" opacity="0.90"/>
    </g>
  </svg>

  <!-- Content — inherits color from body so day/night tint applies automatically -->
  <div class="relative z-10 flex flex-col items-center gap-6">

    <h1 class="text-xs tracking-[0.5em] uppercase font-light" style="opacity:0.35">AethelDesk</h1>

    <div class="flex flex-col items-center gap-3">
      <label for="pin-input" class="sr-only">방 PIN</label>
      <input id="pin-input" type="password" inputmode="numeric" autocomplete="off" placeholder="방 PIN"
        aria-describedby="lobby-error"
        class="bg-transparent text-center text-sm font-light tracking-[0.3em] outline-none w-32 pb-2"
        style="border-bottom: 1px solid currentColor; opacity: 0.75;" />
      <button id="btn-start"
        class="font-light tracking-[0.5em] text-xs uppercase px-10 py-4 hover:opacity-100 transition-opacity duration-300"
        style="opacity:0.6">
        시작
      </button>
    </div>

    <p id="lobby-error" class="text-xs font-light tracking-widest" role="status" aria-live="polite" aria-atomic="true" style="opacity:0.55"></p>

    <button id="code-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="code-section"
      class="text-xs font-light tracking-widest hover:opacity-60 transition-opacity duration-300"
      style="opacity:0.25">
      방 코드로 입장 →
    </button>

    <div id="code-section" aria-hidden="true">
      <div class="flex flex-col items-center gap-3 pt-3">
        <label for="room-input" class="sr-only">방 코드</label>
        <input id="room-input" type="text" maxlength="8" placeholder="방 코드"
          aria-describedby="lobby-error" tabindex="-1"
          class="bg-transparent text-center text-xl font-extralight tracking-[0.3em] uppercase outline-none w-40 pb-2"
          style="border-bottom: 1px solid currentColor; opacity: 0.9;" />
        <button id="btn-join"
          type="button" tabindex="-1"
          class="text-xs tracking-[0.3em] uppercase font-light hover:opacity-100 transition-opacity duration-300"
          style="opacity:0.4">
          입장
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="/lobby.js"></script>
</body>
</html>

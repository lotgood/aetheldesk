[project]
name = "aetheldesk"
version = "0.1.0"
description = "A quiet celestial productivity dashboard with a FastAPI backend and static frontend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astral==3.2",
    "fastapi==0.111.0",
    "redis==5.2.1",
    "uvicorn[standard]==0.32.0",
    "websockets==12.0",
]

[dependency-groups]
dev = [
    "playwright==1.52.0",
    "pre-commit>=4.0,<5.0",
    "pyright>=1.1.390,<2.0",
    "pytest==8.3.3",
    "pytest-playwright==0.7.0",
    "ruff>=0.8.0,<1.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".omo",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/connection_manager.py" = ["F401"]
"backend/main.py" = ["F401"]
"tests/test_websocket_redis.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "tests"]

[tool.ruff.format]
exclude = [
    "backend/celestial.py",
    "backend/config.py",
    "backend/connection_manager.py",
    "backend/event_bus.py",
    "backend/main.py",
    "backend/room_store.py",
    "tests/e2e/test_room_sync.py",
    "tests/test_backend_state.py",
    "tests/test_connection_manager.py",
    "tests/test_frontend_static.py",
    "tests/test_redis_contract.py",
    "tests/test_websocket_redis.py",
]

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "basic"
include = ["backend", "tests"]
exclude = [
    "**/__pycache__",
    ".git",
    ".omo",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportOptionalMemberAccess = false
